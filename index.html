<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#07111f"><title>ESPN Fantasy Draft Board</title><style>:root{--bg:#07111f;--card:#0e1c2b;--line:#263d55;--text:#f7fafc;--muted:#9fb1c2;--green:#4ade80;--gold:#facc15}*{box-sizing:border-box}body{margin:0;background:#07111f;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:12px 10px 86px}header{position:sticky;top:0;z-index:10;background:#07111ff2;backdrop-filter:blur(14px);padding:8px 0 10px;border-bottom:1px solid #20354b}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:21px;margin:0}.badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:6px 8px;background:#102238}.note{font-size:12px;color:var(--muted);margin:5px 0 8px}.search{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#081726;color:#fff}.tabs{display:flex;gap:6px;overflow:auto;margin-top:8px}.tab{border:1px solid var(--line);border-radius:999px;padding:7px 10px;background:#0d1b2a;color:#c4d2df;white-space:nowrap}.tab.active{background:white;color:#07111f;font-weight:900}.status{font-size:12px;color:var(--muted);margin:9px 2px}.list{display:grid;gap:7px}.player{width:100%;display:grid;grid-template-columns:34px 48px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;background:var(--card);color:white;padding:9px;text-align:left}.rank{font-weight:950;color:var(--gold);text-align:center}.photo,.fallback{width:48px;height:48px;border-radius:50%;background:#17324b;border:1px solid #31526e;flex:none}.photo{object-fit:cover}.fallback{display:grid;place-items:center;font-weight:900}.playerInfo{min-width:0}.name{font-weight:900;font-size:16px;line-height:1.15;white-space:normal;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted);margin-top:4px}.mark{font-size:10px;font-weight:950;border-radius:999px;padding:6px 7px;background:#12351f;color:#93efaf;align-self:center}.player.taken{opacity:.55;background:#28171d;border-color:#63313f}.player.taken .name{text-decoration:line-through 2px #ff91a5}.player.taken .rank{text-decoration:line-through;color:#a58b90}.player.taken .mark{background:#541e2b;color:#ffc0cd}.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;background:#06101be8;border-top:1px solid #20354b;padding:9px 12px calc(9px + env(safe-area-inset-bottom))}.bottom button{border:0;border-radius:12px;padding:10px 14px;font-weight:900}.undo{background:var(--green);color:#052111}.reset{background:#17304a;color:#fff}@media(max-width:520px){.player{grid-template-columns:30px 46px minmax(0,1fr) auto;gap:8px}.photo,.fallback{width:46px;height:46px}.name{font-size:15px}.mark{font-size:9px;padding:5px 6px}}</style></head><body><div class="app"><header><div class="top"><h1>🏈 ESPN PPR Top 100</h1><div class="badge" id="counter">0 taken</div></div><div class="note">Tap a player to mark TAKEN. Tap again to restore.</div><input id="search" class="search" placeholder="Search player, team or position"><div id="tabs" class="tabs"></div></header><div class="status">2026 ESPN Fantasy Football Draft Kit — first 100 players from your cheat sheet.</div><div id="list" class="list"></div></div><div class="bottom"><button id="undo" class="undo">Undo</button><button id="reset" class="reset">Reset all</button></div><script>const P=[["Jahmyr Gibbs","RB","DET"],["Bijan Robinson","RB","ATL"],["Ja'Marr Chase","WR","CIN"],["Puka Nacua","WR","LAR"],["Jaxon Smith-Njigba","WR","SEA"],["Christian McCaffrey","RB","SF"],["Jonathan Taylor","RB","IND"],["Amon-Ra St. Brown","WR","DET"],["CeeDee Lamb","WR","DAL"],["De'Von Achane","RB","MIA"],["Justin Jefferson","WR","MIN"],["James Cook II","RB","BUF"],["Ashton Jeanty","RB","LV"],["Drake London","WR","ATL"],["Jeremiyah Love","RB","ARI"],["Rashee Rice","WR","KC"],["Trey McBride","TE","ARI"],["Saquon Barkley","RB","PHI"],["Derrick Henry","RB","BAL"],["Chase Brown","RB","CIN"],["Kenneth Walker III","RB","KC"],["Breece Hall","RB","NYJ"],["Omarion Hampton","RB","LAC"],["Brock Bowers","TE","LV"],["Nico Collins","WR","HOU"],["Chris Olave","WR","NO"],["Garrett Wilson","WR","NYJ"],["A.J. Brown","WR","NE"],["Malik Nabers","WR","NYG"],["Josh Jacobs","RB","GB"],["Javonte Williams","RB","DAL"],["George Pickens","WR","DAL"],["Tetairoa McMillan","WR","CAR"],["Zay Flowers","WR","BAL"],["DeVonta Smith","WR","PHI"],["Josh Allen","QB","BUF"],["Travis Etienne Jr.","RB","NO"],["Kyren Williams","RB","LAR"],["Cam Skattebo","RB","NYG"],["Quinshon Judkins","RB","CLE"],["Bucky Irving","RB","TB"],["Emeka Egbuka","WR","TB"],["Davante Adams","WR","LAR"],["Ladd McConkey","WR","LAC"],["Terry McLaurin","WR","WAS"],["Tee Higgins","WR","CIN"],["Jaylen Waddle","WR","DEN"],["Rome Odunze","WR","CHI"],["Colston Loveland","TE","CHI"],["Tyler Warren","TE","IND"],["Jameson Williams","WR","DET"],["DJ Moore","WR","BUF"],["Luther Burden III","WR","CHI"],["Carnell Tate","WR","TEN"],["Jayden Daniels","QB","WAS"],["Lamar Jackson","QB","BAL"],["Drake Maye","QB","NE"],["Jalen Hurts","QB","PHI"],["Bhayshul Tuten","RB","JAC"],["D'Andre Swift","RB","CHI"],["David Montgomery","RB","HOU"],["Jadarian Price","RB","SEA"],["TreVeyon Henderson","RB","NE"],["Rhamondre Stevenson","RB","NE"],["Courtland Sutton","WR","DEN"],["Michael Pittman Jr.","WR","PIT"],["Marvin Harrison Jr.","WR","ARI"],["DK Metcalf","WR","PIT"],["Parker Washington","WR","JAC"],["Alec Pierce","WR","IND"],["Kyle Pitts Sr.","TE","ATL"],["Harold Fannin Jr.","TE","CLE"],["Sam LaPorta","TE","DET"],["Joe Burrow","QB","CIN"],["Jaxson Dart","QB","NYG"],["Mike Evans","WR","SF"],["Christian Watson","WR","GB"],["Matthew Golden","WR","GB"],["Michael Wilson","WR","ARI"],["Brian Thomas Jr.","WR","JAC"],["Jakobi Meyers","WR","JAC"],["Trevor Lawrence","QB","JAC"],["Dak Prescott","QB","DAL"],["Bo Nix","QB","DEN"],["Brock Purdy","QB","SF"],["Matthew Stafford","QB","LAR"],["Caleb Williams","QB","CHI"],["Wan'Dale Robinson","WR","TEN"],["Jordan Addison","WR","MIN"],["Khalil Shakir","WR","BUF"],["Jayden Reed","WR","GB"],["Xavier Worthy","WR","KC"],["Justin Herbert","QB","LAC"],["Patrick Mahomes","QB","KC"],["Jaylen Warren","RB","PIT"],["Rico Dowdle","RB","PIT"],["Tony Pollard","RB","TEN"],["Kenny Gainwell","RB","TB"],["Jonathon Brooks","RB","CAR"],["Chuba Hubbard","RB","CAR"]].map((x,i)=>({id:'p'+(i+1),rank:i+1,name:x[0],position:x[1],team:x[2],espnId:'',sleeperId:''}));const KEY='fantasy-draft-board-v2';let taken={},history=[],filter='ALL';try{taken=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}function initials(n){return n.replace(/[^A-Za-z ]/g,'').split(/\s+/).filter(Boolean).map(x=>x[0]).slice(0,2).join('').toUpperCase()}function norm(n){return n.toLowerCase().replace(/[^a-z0-9]/g,'')}function save(){try{localStorage.setItem(KEY,JSON.stringify(taken))}catch(e){}}function drawTabs(){const a=['ALL','QB','RB','WR','TE'];tabs.innerHTML=a.map(x=>`<button class="tab ${x===filter?'active':''}" data-f="${x}">${x}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;drawTabs();render()})}function photoHtml(p){if(p.espnId)return `<img class="photo" data-espn="1" data-sleeper="${p.sleeperId||''}" src="https://a.espncdn.com/i/headshots/nfl/players/full/${p.espnId}.png" alt="">`;if(p.sleeperId)return `<img class="photo" data-espn="0" data-sleeper="${p.sleeperId}" src="https://sleepercdn.com/content/nfl/players/${p.sleeperId}.jpg" alt="">`;return `<div class="fallback">${initials(p.name)}</div>`}function wirePhotoFallbacks(){list.querySelectorAll('img.photo').forEach(img=>{img.onerror=()=>{const sid=img.dataset.sleeper;if(img.dataset.espn==='1'&&sid){img.dataset.espn='0';img.src='https://sleepercdn.com/content/nfl/players/'+sid+'.jpg';return}const p=img.closest('.player');const name=p?p.querySelector('.name').textContent:'';const d=document.createElement('div');d.className='fallback';d.textContent=initials(name);img.replaceWith(d)}})}function render(){const q=search.value.trim().toLowerCase();const arr=P.filter(p=>(filter==='ALL'||p.position===filter)&&(!q||(p.name+' '+p.team+' '+p.position).toLowerCase().includes(q)));list.innerHTML=arr.map(p=>{const is=!!taken[p.id];return `<button class="player ${is?'taken':''}" data-id="${p.id}"><div class="rank">${p.rank}</div>${photoHtml(p)}<div class="playerInfo"><div class="name">${p.name}</div><div class="meta">${p.position} · ${p.team}</div></div><div class="mark">${is?'TAKEN':'AVAILABLE'}</div></button>`}).join('');wirePhotoFallbacks();list.querySelectorAll('.player').forEach(b=>b.onclick=()=>toggle(b.dataset.id));const n=Object.values(taken).filter(Boolean).length;counter.textContent=n+' taken · '+(100-n)+' left'}function toggle(id){const old=!!taken[id];history.push({id,old});taken[id]=!old;save();render()}undo.onclick=()=>{const h=history.pop();if(!h)return;taken[h.id]=h.old;save();render()};reset.onclick=()=>{if(confirm('Clear every TAKEN mark?')){taken={};history=[];save();render()}};search.oninput=render;async function loadPhotos(){try{const r=await fetch('https://api.sleeper.app/v1/players/nfl');const data=await r.json();const byName={};Object.values(data).forEach(x=>{if(x.full_name)byName[norm(x.full_name)]=x});P.forEach(p=>{let x=byName[norm(p.name)]||byName[norm(p.name.replace(/ II$| Jr\.$| Sr\.$/,''))];if(x){if(x.espn_id)p.espnId=String(x.espn_id);if(x.player_id)p.sleeperId=String(x.player_id)}});render()}catch(e){}}drawTabs();render();loadPhotos();</script></body></html>

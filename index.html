<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#07111f"><title>NFL Fantasy Draft Board</title><style>:root{--bg:#07111f;--card:#0e1c2b;--line:#263d55;--text:#f7fafc;--muted:#9fb1c2;--green:#4ade80;--gold:#facc15}*{box-sizing:border-box}body{margin:0;background:#07111f;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:12px 10px 86px}header{position:sticky;top:0;z-index:10;background:#07111ff2;backdrop-filter:blur(14px);padding:8px 0 10px;border-bottom:1px solid #20354b}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:21px;margin:0}.badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:6px 8px;background:#102238}.note{font-size:12px;color:var(--muted);margin:5px 0 8px}.search{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#081726;color:#fff}.tabs{display:flex;gap:6px;overflow:auto;margin-top:8px}.tab{border:1px solid var(--line);border-radius:999px;padding:7px 10px;background:#0d1b2a;color:#c4d2df;white-space:nowrap}.tab.active{background:white;color:#07111f;font-weight:900}.status{font-size:12px;color:var(--muted);margin:9px 2px}.list{display:grid;gap:7px}.player{width:100%;display:grid;grid-template-columns:38px 48px 1fr auto;gap:9px;align-items:center;border:1px solid var(--line);border-radius:14px;background:var(--card);color:white;padding:8px;text-align:left}.rank{font-weight:950;color:var(--gold);text-align:center}.photo,.fallback{width:48px;height:48px;border-radius:50%;background:#17324b;border:1px solid #31526e}.photo{object-fit:cover}.fallback{display:grid;place-items:center;font-weight:900}.name{font-weight:900}.meta{font-size:12px;color:var(--muted);margin-top:3px}.mark{font-size:10px;font-weight:950;border-radius:999px;padding:6px 7px;background:#12351f;color:#93efaf}.player.taken{opacity:.55;background:#28171d;border-color:#63313f}.player.taken .name{text-decoration:line-through 2px #ff91a5}.player.taken .rank{text-decoration:line-through;color:#a58b90}.player.taken .mark{background:#541e2b;color:#ffc0cd}.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;background:#06101be8;border-top:1px solid #20354b;padding:9px 12px calc(9px + env(safe-area-inset-bottom))}.bottom button{border:0;border-radius:12px;padding:10px 14px;font-weight:900}.undo{background:var(--green);color:#052111}.reset{background:#17304a;color:#fff}</style></head><body><div class="app"><header><div class="top"><h1>🏈 ESPN PPR Draft Board</h1><div class="badge" id="counter">0 taken</div></div><div class="note">Tap a player to mark TAKEN. Tap again to restore. Player headshots load automatically when online.</div><input id="search" class="search" placeholder="Search player, team or position"><div id="tabs" class="tabs"></div></header><div class="status">Top 100 PPR-style board based on ESPN 2026 fantasy rankings.</div><div id="list" class="list"></div></div><div class="bottom"><button id="undo" class="undo">Undo</button><button id="reset" class="reset">Reset all</button></div><script>const P=[['Puka Nacua','WR','LAR'],["Ja'Marr Chase",'WR','CIN'],['Bijan Robinson','RB','ATL'],['Jahmyr Gibbs','RB','DET'],['Jaxon Smith-Njigba','WR','SEA'],['Amon-Ra St. Brown','WR','DET'],['CeeDee Lamb','WR','DAL'],['Christian McCaffrey','RB','SF'],['Drake London','WR','ATL'],['Justin Jefferson','WR','MIN'],['Jonathan Taylor','RB','IND'],["De'Von Achane",'RB','MIA'],['Malik Nabers','WR','NYG'],['Nico Collins','WR','HOU'],['James Cook','RB','BUF'],['Ashton Jeanty','RB','LV'],['Saquon Barkley','RB','PHI'],['Rashee Rice','WR','KC'],['Josh Jacobs','RB','GB'],['Brock Bowers','TE','LV'],['Derrick Henry','RB','BAL'],['Trey McBride','TE','ARI'],['A.J. Brown','WR','PHI'],['Chris Olave','WR','NO'],['Garrett Wilson','WR','NYJ'],['Omarion Hampton','RB','LAC'],['Chase Brown','RB','CIN'],['George Pickens','WR','DAL'],['Tetairoa McMillan','WR','CAR'],['Kenneth Walker III','RB','KC'],['Breece Hall','RB','NYJ'],['Zay Flowers','WR','BAL'],['Davante Adams','WR','LAR'],['Bucky Irving','RB','TB'],['Kyren Williams','RB','LAR'],['DeVonta Smith','WR','PHI'],['Terry McLaurin','WR','WAS'],['Josh Allen','QB','BUF'],['Jaylen Waddle','WR','MIA'],['Tee Higgins','WR','CIN'],['DK Metcalf','WR','PIT'],['Ladd McConkey','WR','LAC'],['Javonte Williams','RB','DAL'],['Cam Skattebo','RB','NYG'],['Quinshon Judkins','RB','CLE'],['Travis Etienne Jr.','RB','NO'],['Drake Maye','QB','NE'],['Lamar Jackson','QB','BAL'],['Courtland Sutton','WR','DEN'],['Jameson Williams','WR','DET'],['Mike Evans','WR','SF'],['Marvin Harrison Jr.','WR','ARI'],['Rome Odunze','WR','CHI'],['Emeka Egbuka','WR','TB'],['Chuba Hubbard','RB','CAR'],['TreVeyon Henderson','RB','NE'],["D'Andre Swift",'RB','CHI'],['Jalen Hurts','QB','PHI'],['Jayden Daniels','QB','WAS'],['George Kittle','TE','SF'],['Sam LaPorta','TE','DET'],['Joe Burrow','QB','CIN'],['Luther Burden III','WR','CHI'],['DJ Moore','WR','BUF'],['Alec Pierce','WR','IND'],['Chris Godwin','WR','TB'],['Jakobi Meyers','WR','JAX'],['Christian Watson','WR','GB'],['Calvin Ridley','WR','TEN'],['Ricky Pearsall','WR','SF'],['Tony Pollard','RB','TEN'],['J.K. Dobbins','RB','DEN'],['David Montgomery','RB','HOU'],['Aaron Jones','RB','MIN'],['James Conner','RB','ARI'],['Rhamondre Stevenson','RB','NE'],['RJ Harvey','RB','DEN'],['Jaylen Warren','RB','PIT'],['Patrick Mahomes','QB','KC'],['Bo Nix','QB','DEN'],['Caleb Williams','QB','CHI'],['Dak Prescott','QB','DAL'],['Justin Herbert','QB','LAC'],['Trevor Lawrence','QB','JAX'],['T.J. Hockenson','TE','MIN'],['Dalton Kincaid','TE','BUF'],['David Njoku','TE','CLE'],['Evan Engram','TE','DEN'],['Jake Ferguson','TE','DAL'],['Travis Kelce','TE','KC'],['Tucker Kraft','TE','GB'],['Kyle Pitts','TE','ATL'],['Brian Thomas Jr.','WR','JAX'],['Khalil Shakir','WR','BUF'],['Jerry Jeudy','WR','CLE'],['Xavier Worthy','WR','KC'],['Jayden Reed','WR','GB'],['Jordan Addison','WR','MIN'],['Michael Wilson','WR','ARI'],['Matthew Golden','WR','GB']].map((x,i)=>({id:'p'+(i+1),rank:i+1,name:x[0],position:x[1],team:x[2],espnId:''}));const KEY='fantasy-draft-board-v1';let taken={},history=[],filter='ALL';try{taken=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}function initials(n){return n.replace(/[^A-Za-z ]/g,'').split(/\s+/).filter(Boolean).map(x=>x[0]).slice(0,2).join('').toUpperCase()}function save(){try{localStorage.setItem(KEY,JSON.stringify(taken))}catch(e){}}function drawTabs(){const a=['ALL','QB','RB','WR','TE'];tabs.innerHTML=a.map(x=>`<button class="tab ${x===filter?'active':''}" data-f="${x}">${x}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;drawTabs();render()})}function render(){const q=search.value.trim().toLowerCase();const arr=P.filter(p=>(filter==='ALL'||p.position===filter)&&(!q||(p.name+' '+p.team+' '+p.position).toLowerCase().includes(q)));list.innerHTML=arr.map(p=>{const is=!!taken[p.id];const img=p.espnId?`<img class="photo" src="https://a.espncdn.com/i/headshots/nfl/players/full/${p.espnId}.png" onerror="this.outerHTML='<div class=&quot;fallback&quot;>${initials(p.name)}</div>'">`:`<div class="fallback">${initials(p.name)}</div>`;return `<button class="player ${is?'taken':''}" data-id="${p.id}"><div class="rank">${p.rank}</div>${img}<div><div class="name">${p.name}</div><div class="meta">${p.position} · ${p.team}</div></div><div class="mark">${is?'TAKEN':'AVAILABLE'}</div></button>`}).join('');list.querySelectorAll('.player').forEach(b=>b.onclick=()=>toggle(b.dataset.id));const n=Object.values(taken).filter(Boolean).length;counter.textContent=n+' taken · '+(100-n)+' left'}function toggle(id){const old=!!taken[id];history.push({id,old});taken[id]=!old;save();render()}undo.onclick=()=>{const h=history.pop();if(!h)return;taken[h.id]=h.old;save();render()};reset.onclick=()=>{if(confirm('Clear every TAKEN mark?')){taken={};history=[];save();render()}};search.oninput=render;async function loadPhotos(){try{const r=await fetch('https://api.sleeper.app/v1/players/nfl');const data=await r.json();const byName={};Object.values(data).forEach(x=>{if(x.full_name)byName[x.full_name.toLowerCase()]=x});P.forEach(p=>{const x=byName[p.name.toLowerCase()];if(x&&x.espn_id)p.espnId=String(x.espn_id)});render()}catch(e){}}drawTabs();render();loadPhotos();</script></body></html>
